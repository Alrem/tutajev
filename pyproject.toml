[project]
name = "tutajev"
version = "0.1.0"
description = "Spam classifier for Tuta mail (tutaproxy for mailbox access, Jev for classification)"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    # Runtime dependencies of the vendored tutaproxy `tuta` package (pinned as in its requirements.txt).
    "aiohttp==3.13.5",
    "argon2-cffi==25.1.0",
    "cryptography==44.0.3",
    "kyber-py==1.2.0",
    "lz4==4.4.5",
    "certifi",
    "typesafe-sdk>=0.7.2",
]

[project.scripts]
tutajev = "tutajev.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutajev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
